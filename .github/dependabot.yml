# Todas las actualizaciones (Go, GitHub Actions) llegan en una sola PR semanal.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Madrid
    labels:
      - dependencies
    assignees:
      - javiyt
    commit-message:
      prefix: deps

updates:
  - package-ecosystem: gomod
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
